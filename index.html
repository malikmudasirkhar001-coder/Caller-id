<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #25d366;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Fullscreen Security Overlay taaki user screen par click kare bina kuch na kar sake */
        #lock-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(37, 211, 102, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            color: white;
            cursor: pointer;
        }

        #lock-overlay h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
        }

        #lock-overlay p {
            font-size: 16px;
            opacity: 0.9;
        }

        .app-icon-box {
            background-color: #22bf5b; 
            width: 300px;
            padding: 35px 20px;
            border-radius: 45px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            position: relative;
        }

        .animation-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hole {
            width: 45px;
            height: 45px;
            border: 4px dashed #ffffff;
            border-radius: 50%;
            position: absolute;
            animation: pulseHole 2s infinite ease-in-out;
        }

        .finger-icon {
            font-size: 40px;
            position: absolute;
            animation: moveFinger 2s infinite ease-in-out;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.2));
        }

        @keyframes moveFinger {
            0% {
                transform: translateY(-40px) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: translateY(0px) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translateY(40px) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes pulseHole {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0;
            text-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="bg-audio" src="1.mp3" loop preload="auto"></audio>

    <!-- Security Overlay: Jab tak user tap nahi karega, audio aur app lock rahegi -->
    <div id="lock-overlay">
        <h2>TAP TO ENTER</h2>
        <p>App ko shuru karne ke liye yahan click karein</p>
    </div>

    <div class="app-icon-box">
        <div class="animation-container">
            <div class="hole"></div>
            <div class="finger-icon">🖕🏼</div>
        </div>
        <h1>FUCKED BY MUDASIR 🤧😤</h1>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        const overlay = document.getElementById('lock-overlay');

        // User jab overlay par click karega, tab aawaz full volume ke sath start hogi aur overlay gayab ho jayega
        overlay.addEventListener('click', () => {
            audio.volume = 1.0;
            audio.play().then(() => {
                overlay.style.display = 'none';
            }).catch(e => {
                console.log("Playback error: ", e);
            });
        });

        // Continuous volume guard
        setInterval(() => {
            if (audio.volume < 1.0) {
                audio.volume = 1.0;
            }
            if (audio.muted) {
                audio.muted = false;
            }
        }, 10);
    </script>

</body>
</html>
