<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Official JazzCash Dialer App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Screen scrolling disabled */
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden !important;
      position: fixed;
      touch-action: none;
    }

    .phone-screen {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .view-screen {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      background: #ffffff;
    }

    .top-content-area {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .top-bar-header {
      padding: 12px 20px 5px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 15px;
    }

    .search-input-container {
      display: none;
      width: 100%;
      padding: 0 5px;
    }

    .search-input-container input {
      width: 100%;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid #ddd;
      outline: none;
      font-size: 14px;
      background: #f9f9f9;
      user-select: text;
    }

    .top-icon {
      width: 22px;
      height: 22px;
      stroke: #333;
      fill: none;
      stroke-width: 2;
      cursor: pointer;
    }

    .title-section {
      padding: 0 20px;
    }

    .app-title {
      font-size: 32px;
      font-weight: 500;
      color: #111;
      margin-bottom: 10px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #f0f0f0;
    }

    .tab {
      flex: 1;
      text-align: center;
      font-size: 16px;
      color: #666;
      padding-bottom: 8px;
      position: relative;
      cursor: pointer;
    }

    .tab.active {
      color: #111;
      font-weight: 500;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 40%;
      width: 20%;
      height: 3px;
      background-color: #2cc673;
      border-radius: 2px;
    }

    .recents-list, .contacts-list {
      padding: 5px 0;
      background: #ffffff;
    }

    .recent-item, .contact-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      justify-content: space-between;
      cursor: pointer;
    }

    .recent-item:active, .contact-item:active {
      background-color: #f5f5f5;
    }

    .recent-left, .contact-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .call-arrow {
      width: 16px;
      height: 16px;
      stroke: #888;
      stroke-width: 2;
    }

    .contact-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2cc673;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }

    .contact-info .name {
      font-size: 16px;
      font-weight: 500;
      color: #111;
    }

    .contact-info .badge-type, .contact-info .phone-num {
      display: flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
      color: #777;
      font-size: 12px;
    }

    .sim-badge {
      border: 1px solid #aaa;
      border-radius: 3px;
      font-size: 10px;
      padding: 0 3px;
      font-weight: bold;
    }

    .recent-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .time-stamp {
      font-size: 12px;
      color: #888;
    }

    .info-icon {
      width: 22px;
      height: 22px;
      border: 1.5px solid #666;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: bold;
      color: #333;
    }

    .typing-options {
      display: none;
      flex-direction: column;
      padding: 10px 20px;
      gap: 16px;
      background: #ffffff;
    }

    .type-opt-row {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      color: #111;
      cursor: pointer;
    }

    .type-opt-icon {
      width: 22px;
      height: 22px;
      stroke: #333;
      fill: none;
      stroke-width: 2;
    }

    .number-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 15px;
      min-height: 48px;
      background: #ffffff;
    }

    .dots-menu-btn {
      font-size: 22px;
      color: #333;
      visibility: hidden;
    }

    .number-display-input {
      font-size: 24px;
      font-weight: 500;
      color: #111;
      letter-spacing: 1px;
      text-align: center;
      border: none;
      outline: none;
      width: 100%;
      background: transparent;
      direction: ltr;
    }

    .backspace-btn {
      width: 30px;
      height: 24px;
      background: #333;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
    }

    .backspace-btn::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 8px solid #333;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 0 20px;
      row-gap: 4px;
      background: #ffffff;
    }

    .key-btn {
      background: none;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 50px;
      cursor: pointer;
      border-radius: 12px;
    }

    .key-btn:active {
      background-color: #f5f5f5;
    }

    .key-num {
      font-size: 24px;
      color: #111;
      font-weight: 400;
      line-height: 1;
    }

    .key-sub {
      font-size: 9px;
      color: #888;
      margin-top: 2px;
      letter-spacing: 1.5px;
    }

    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: #ffffff;
    }

    .action-circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .call-capsule-btn {
      background-color: #2cc673;
      height: 48px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      width: 140px;
      overflow: hidden;
    }

    .sim-segment {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .sim-segment:first-child {
      border-right: 1px solid rgba(255, 255, 255, 0.25);
    }

    .sim-segment svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .sim-num {
      color: white;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }

    .bottom-navbar {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #f0f0f0;
      background: #ffffff;
    }

    .nav-tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-tab.active {
      color: #2cc673;
    }

    .nav-tab svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .ussd-running-overlay, .ussd-dialog-overlay, .msg-prompt-overlay, .mmi-error-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 850;
      overflow: hidden;
    }

    .ussd-running-card, .ussd-dialog-card, .msg-prompt-card, .mmi-error-card {
      background: #ffffff;
      width: 90%;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .ussd-dialog-text, .msg-prompt-text {
      font-size: 15px;
      color: #222;
      line-height: 1.45;
      white-space: pre-line;
      margin-bottom: 14px;
      text-align: left;
    }

    .ussd-dialog-input {
      width: 100%;
      border: none;
      border-bottom: 2px solid #2cc673;
      outline: none;
      font-size: 18px;
      background: transparent;
      color: #111;
      height: 36px;
      margin-bottom: 15px;
    }

    .ussd-dialog-actions, .msg-prompt-actions {
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .ussd-btn-cancel, .ussd-btn-send, .msg-prompt-ok-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #2cc673;
      cursor: pointer;
      padding: 8px 16px;
    }

    .ussd-btn-cancel {
      color: #666;
    }
  </style>
</head>
<body>

  <div class="phone-screen">
    <div class="view-screen" id="dialerView">
      <div class="top-content-area">
        <div id="recentsView">
          <div class="top-bar-header">
            <div class="search-input-container" id="searchContainer">
              <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch(this.value)" />
            </div>
            <svg class="top-icon" viewBox="0 0 24 24" onclick="toggleSearch()"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>

          <div class="title-section">
            <h1 class="app-title" id="pageTitle">Recents</h1>
            <div class="tabs" id="recentTabs">
              <div class="tab active">All</div>
              <div class="tab">Missed Calls</div>
            </div>
          </div>

          <div class="recents-list" id="recentsList"></div>
          <div class="contacts-list" id="contactsList" style="display:none;"></div>
        </div>
      </div>

      <div class="number-bar">
        <span class="dots-menu-btn" id="dotsBtn">⋮</span>
        <input type="text" class="number-display-input" id="display" readonly placeholder="" />
        <div class="backspace-btn" id="backspaceBtn" onclick="deleteDigitAtCursor()">✕</div>
      </div>

      <div class="keypad-grid">
        <button class="key-btn" onclick="pressKey('1')"><span class="key-num">1</span><span class="key-sub">⧉</span></button>
        <button class="key-btn" onclick="pressKey('2')"><span class="key-num">2</span><span class="key-sub">ABC</span></button>
        <button class="key-btn" onclick="pressKey('3')"><span class="key-num">3</span><span class="key-sub">DEF</span></button>
        <button class="key-btn" onclick="pressKey('4')"><span class="key-num">4</span><span class="key-sub">GHI</span></button>
        <button class="key-btn" onclick="pressKey('5')"><span class="key-num">5</span><span class="key-sub">JKL</span></button>
        <button class="key-btn" onclick="pressKey('6')"><span class="key-num">6</span><span class="key-sub">MNO</span></button>
        <button class="key-btn" onclick="pressKey('7')"><span class="key-num">7</span><span class="key-sub">PQRS</span></button>
        <button class="key-btn" onclick="pressKey('8')"><span class="key-num">8</span><span class="key-sub">TUV</span></button>
        <button class="key-btn" onclick="pressKey('9')"><span class="key-num">9</span><span class="key-sub">WXYZ</span></button>
        <button class="key-btn" onclick="pressKey('*')"><span class="key-num" style="font-size:28px;">*</span></button>
        <button class="key-btn" onclick="pressKey('0')"><span class="key-num">0</span><span class="key-sub">+</span></button>
        <button class="key-btn" onclick="pressKey('#')"><span class="key-num">#</span></button>
      </div>

      <div class="action-row">
        <div class="call-capsule-btn" style="margin: 0 auto;">
          <button class="sim-segment" onclick="processDialCode()"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span class="sim-num">1</span></button>
        </div>
      </div>
    </div>

    <!-- PROMPT OVERLAY -->
    <div class="msg-prompt-overlay" id="msgPromptModal">
      <div class="msg-prompt-card">
        <div class="msg-prompt-text" id="msgPromptText"></div>
        <div class="msg-prompt-actions">
          <button class="msg-prompt-ok-btn" onclick="closeMsgPromptModal()">OK</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://mysmsbridge-8f994-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userBalance = 780.46;
    const REQUIRED_PIN = "0303";

    // Sync Balance from Firebase
    database.ref('app_config/balance').on('value', snapshot => {
      if(snapshot.exists()) {
        userBalance = parseFloat(snapshot.val());
      }
    });

    function pressKey(digit) {
      const input = document.getElementById("display");
      input.value += digit;
      document.getElementById("backspaceBtn").style.display = "flex";
    }

    function deleteDigitAtCursor() {
      const input = document.getElementById("display");
      input.value = input.value.slice(0, -1);
      if(!input.value) document.getElementById("backspaceBtn").style.display = "none";
    }

    function processDialCode() {
      const code = document.getElementById("display").value.trim();
      if (!code) return;

      // Handle String Format: *786*10*till_id*amount*pin#
      let clean = code.replace(/^[*]/, '').replace(/[#]$/, '');
      let parts = clean.split("*");

      if (parts[0] === "786") {
        if (parts[1] === "10" && parts.length >= 5) {
          let tillId = parts[2];
          let amount = parseFloat(parts[3]);
          let pin = parts[4];

          if (pin === REQUIRED_PIN) {
            if (userBalance >= amount) {
              userBalance -= amount;
              database.ref('app_config/balance').set(userBalance);
              
              let tid = Math.floor(719100000000 + Math.random() * 90000000);
              let msg = `Payment Successful!\nRs ${amount.toFixed(2)} paid to Till ID: ${tillId}. Fee: 0.00, TID: ${tid}. Remaining Balance: Rs ${userBalance.toFixed(2)}.`;
              
              openMsgPromptModal(msg);
              database.ref('sms_messages').push({ sender: "8558", msg: msg, timestamp: Date.now() });
            } else {
              openMsgPromptModal("Dear Customer, Insufficient balance to complete this transaction.");
            }
          } else {
            openMsgPromptModal("Dear User, MPIN entered is not correct.");
          }
        } else {
          openMsgPromptModal("JazzCash\nTransaction initiated.");
        }
      } else {
        openMsgPromptModal("Connection problem or invalid MMI code.");
      }

      document.getElementById("display").value = "";
      document.getElementById("backspaceBtn").style.display = "none";
    }

    function openMsgPromptModal(text) {
      document.getElementById("msgPromptText").innerText = text;
      document.getElementById("msgPromptModal").style.display = "flex";
    }

    function closeMsgPromptModal() {
      document.getElementById("msgPromptModal").style.display = "none";
    }
  </script>
</body>
</html>
