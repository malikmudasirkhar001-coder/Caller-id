<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #25d366;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .app-icon-box {
            background-color: #22bf5b; 
            width: 300px;
            padding: 35px 20px;
            border-radius: 45px; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1.5s ease-in-out;
            position: relative;
        }

        .animation-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hole {
            width: 45px;
            height: 45px;
            border: 4px dashed #ffffff;
            border-radius: 50%;
            position: absolute;
            animation: pulseHole 2s infinite ease-in-out;
        }

        .finger-icon {
            font-size: 40px;
            position: absolute;
            animation: moveFinger 2s infinite ease-in-out;
            filter: drop-shadow(0px 3px 5px rgba(0, 0, 0, 0.2));
        }

        @keyframes moveFinger {
            0% {
                transform: translateY(-40px) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: translateY(0px) scale(1.1);
                opacity: 1;
            }
            100% {
                transform: translateY(40px) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes pulseHole {
            0%, 100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 0 0 8px 0;
            text-shadow: 0px 3px 10px rgba(0, 0, 0, 0.2);
        }

        /* Nayi Description Style (Enjoy the song) */
        .sub-text {
            color: #f1f1f1;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0;
            opacity: 0.9;
            text-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
<body>

    <!-- Background Audio Setup -->
    <audio id="bg-audio" src="1.mp3" autoplay loop preload="auto"></audio>

    <div class="app-icon-box">
        <div class="animation-container">
            <div class="hole"></div>
            <div class="finger-icon">🖕🏼</div>
        </div>
        <h1>WELCOME TO MY APP</h1>
        <p class="sub-text">Enjoy The Song</p>
    </div>

    <script>
        const audio = document.getElementById('bg-audio');
        
        let audioCtx, source, gainNode;

        function initAudioLock() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    source = audioCtx.createMediaElementSource(audio);
                    gainNode = audioCtx.createGain();
                    gainNode.gain.value = 1.0;
                    source.connect(gainNode);
                    gainNode.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch (e) {
                console.log("Web Audio API error: ", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            audio.volume = 1.0;
            audio.play().then(() => {
                initAudioLock();
            }).catch(() => {
                document.body.addEventListener('click', () => {
                    audio.volume = 1.0;
                    audio.play();
                    initAudioLock();
                }, { once: true });
            });
        });

        setInterval(() => {
            if (audio.volume !== 1.0) {
                audio.volume = 1.0;
            }
            if (audio.muted) {
                audio.muted = false;
            }
            if (gainNode) {
                gainNode.gain.value = 1.0;
            }
        }, 50);

        window.addEventListener('keydown', function(e) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }, true);
    </script>

</body>
</html>
