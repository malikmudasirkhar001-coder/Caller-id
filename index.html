<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #25d366; /* Wahi original green color */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Poppins', sans-serif;
        }
        h1 {
            color: #ffffff;
            font-size: 48px;
            font-weight: 900; /* Bohat hi bold aur solid */
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            text-shadow: 0px 4px 15px rgba(0, 0, 0, 0.2); /* Stylish shadow effect */
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>
