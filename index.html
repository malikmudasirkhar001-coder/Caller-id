<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Official JazzCash Dialer App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    /* Screen Scroll Completely Disabled */
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #ffffff;
      overflow: hidden !important;
      position: fixed;
      touch-action: none;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Top Dynamic Unsaved Number Options Area */
    .top-options-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 16px;
      color: #1a1a1a;
      cursor: pointer;
      font-weight: 500;
    }

    .option-item svg {
      width: 24px;
      height: 24px;
      fill: none;
      stroke: #333;
      stroke-width: 2;
    }

    /* Display Section */
    .display-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px 20px;
      min-height: 50px;
      background: #ffffff;
    }

    .menu-btn {
      font-size: 22px;
      cursor: pointer;
      padding: 5px;
      color: #333;
    }

    .number-display {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 1px;
      color: #111;
      width: 100%;
      text-align: center;
      direction: ltr;
    }

    .backspace-btn {
      width: 30px;
      height: 24px;
      background: #333;
      color: #fff;
      display: none;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      position: relative;
    }

    .backspace-btn::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 0;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-right: 8px solid #333;
    }

    /* Keypad Grid */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      row-gap: 4px;
      padding: 0 20px;
      background: #ffffff;
    }

    .key {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 52px;
      cursor: pointer;
      border-radius: 12px;
    }

    .key:active {
      background-color: #f5f5f5;
    }

    .key .num {
      font-size: 24px;
      font-weight: 400;
      color: #111;
      line-height: 1;
    }

    .key .letters {
      font-size: 9px;
      color: #888;
      margin-top: 2px;
      letter-spacing: 1.5px;
    }

    /* Action Buttons Bar */
    .action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 20px;
      background: #ffffff;
    }

    .call-capsule-btn {
      background-color: #2cc673;
      height: 48px;
      border-radius: 24px;
      display: flex;
      align-items: center;
      width: 140px;
      overflow: hidden;
      margin: 0 auto;
    }

    .sim-segment {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: transparent;
    }

    .sim-segment svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .sim-num {
      color: white;
      font-size: 11px;
      font-weight: 600;
      margin-top: 5px;
    }

    /* Bottom Navigation Bar */
    .bottom-nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0 12px;
      border-top: 1px solid #f0f0f0;
      background: #ffffff;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #888;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #2cc673;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Modal Screen Prompt */
    .msg-prompt-overlay {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      justify-content: center;
      align-items: center;
      padding: 15px;
      z-index: 850;
      overflow: hidden;
    }

    .msg-prompt-card {
      background: #ffffff;
      width: 90%;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .msg-prompt-text {
      font-size: 15px;
      color: #222;
      line-height: 1.45;
      white-space: pre-line;
      margin-bottom: 14px;
      text-align: left;
    }

    .msg-prompt-ok-btn {
      background: none;
      border: none;
      font-size: 16px;
      font-weight: 600;
      color: #2cc673;
      cursor: pointer;
      padding: 6px 16px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- Dynamic Top Unsaved Options Area -->
    <div class="top-options-container" id="topOptions">
      <div class="option-item">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span>Create New Contact</span>
      </div>
      <div class="option-item">
        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="17" y1="11" x2="23" y2="11"/></svg>
        <span>Add to Existing Contact</span>
      </div>
      <div class="option-item">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>Send SMS</span>
      </div>
      <div class="option-item">
        <svg viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
        <span>Meet Video Call</span>
      </div>
    </div>

    <!-- Number Display Section -->
    <div class="display-section">
      <div class="menu-btn">⋮</div>
      <div class="number-display" id="phoneNumber"></div>
      <div class="backspace-btn" id="backspaceBtn" onclick="deleteDigit()">✕</div>
    </div>

    <!-- Keypad Grid -->
    <div class="keypad">
      <div class="key" onclick="appendDigit('1')"><span class="num">1</span><span class="letters">⧉</span></div>
      <div class="key" onclick="appendDigit('2')"><span class="num">2</span><span class="letters">ABC</span></div>
      <div class="key" onclick="appendDigit('3')"><span class="num">3</span><span class="letters">DEF</span></div>
      <div class="key" onclick="appendDigit('4')"><span class="num">4</span><span class="letters">GHI</span></div>
      <div class="key" onclick="appendDigit('5')"><span class="num">5</span><span class="letters">JKL</span></div>
      <div class="key" onclick="appendDigit('6')"><span class="num">6</span><span class="letters">MNO</span></div>
      <div class="key" onclick="appendDigit('7')"><span class="num">7</span><span class="letters">PQRS</span></div>
      <div class="key" onclick="appendDigit('8')"><span class="num">8</span><span class="letters">TUV</span></div>
      <div class="key" onclick="appendDigit('9')"><span class="num">9</span><span class="letters">WXYZ</span></div>
      <div class="key" onclick="appendDigit('*')"><span class="num" style="font-size:28px;">*</span></div>
      <div class="key" onclick="appendDigit('0')"><span class="num">0</span><span class="letters">+</span></div>
      <div class="key" onclick="appendDigit('#')"><span class="num">#</span></div>
    </div>

    <!-- Call Button -->
    <div class="action-row">
      <div class="call-capsule-btn">
        <button class="sim-segment" onclick="processDialCode()"><svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg><span class="sim-num">1</span></button>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
      <div class="nav-item active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span>Recents</span>
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span>Contacts</span>
      </div>
    </div>

    <!-- Message Prompt Overlay -->
    <div class="msg-prompt-overlay" id="msgPromptModal">
      <div class="msg-prompt-card">
        <div class="msg-prompt-text" id="msgPromptText"></div>
        <div class="msg-prompt-actions">
          <button class="msg-prompt-ok-btn" onclick="closeMsgPromptModal()">OK</button>
        </div>
      </div>
    </div>

  </div>

  <!-- Firebase Integration -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <script>
    const firebaseConfig = {
      databaseURL: "https://mysmsbridge-8f994-default-rtdb.firebaseio.com/"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let userBalance = 780.46;
    let tillIdsDB = {};
    const REQUIRED_PIN = "0303";

    // 1. Sync Live Balance from Admin Panel
    database.ref('app_config/balance').on('value', snapshot => {
      if(snapshot.exists()) {
        userBalance = parseFloat(snapshot.val());
      }
    });

    // 2. Sync Till IDs DB from Admin Panel
    database.ref('till_ids').on('value', snapshot => {
      if(snapshot.exists()) {
        tillIdsDB = snapshot.val();
      }
    });

    function appendDigit(digit) {
      const display = document.getElementById('phoneNumber');
      display.innerText += digit;
      document.getElementById('backspaceBtn').style.display = 'flex';
    }

    function deleteDigit() {
      const display = document.getElementById('phoneNumber');
      display.innerText = display.innerText.slice(0, -1);
      if(!display.innerText) document.getElementById('backspaceBtn').style.display = 'none';
    }

    function processDialCode() {
      const display = document.getElementById('phoneNumber');
      const code = display.innerText.trim();
      if (!code) return;

      let clean = code.replace(/^[*]/, '').replace(/[#]$/, '');
      let parts = clean.split("*");

      if (parts[0] === "786" && parts[1] === "10" && parts.length >= 5) {
        let tillId = parts[2];
        let reqAmount = parseFloat(parts[3]) || 0;
        let pin = parts[4];

        let merchantName = (tillIdsDB[tillId] && tillIdsDB[tillId].name) ? tillIdsDB[tillId].name : "MASHALLAH_MOBILE_SHOP";

        if (userBalance < reqAmount) {
          openMsgPromptModal("Dear Customer, Insufficient balance to complete this transaction.");
          return;
        }

        if (pin === REQUIRED_PIN) {
          userBalance -= reqAmount;
          database.ref('app_config/balance').set(userBalance);

          let tid = Math.floor(719100000000 + Math.random() * 90000000);
          let now = new Date();
          let dateStr = now.toLocaleDateString('en-GB');
          let timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
          
          let msg = `Payment Successful!\nRs ${reqAmount.toFixed(2)} paid to ${merchantName}, Till ID: ${tillId} on ${dateStr} at ${timeStr}. Fee 0.00, TID: ${tid}. Remaining Bal: Rs ${userBalance.toFixed(2)}.`;
          
          openMsgPromptModal(msg);
          database.ref('sms_messages').push({ sender: "8558", msg: msg, timestamp: Date.now() });
        } else {
          openMsgPromptModal("Dear User, MPIN entered is not correct.");
        }
      } else {
        openMsgPromptModal("Jazz Message\nConnection problem or invalid MMI code.");
      }

      display.innerText = "";
      document.getElementById('backspaceBtn').style.display = 'none';
    }

    function openMsgPromptModal(text) {
      document.getElementById("msgPromptText").innerText = text;
      document.getElementById("msgPromptModal").style.display = "flex";
    }

    function closeMsgPromptModal() {
      document.getElementById("msgPromptModal").style.display = "none";
    }
  </script>
</body>
</html>
